<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOnomus | O Futuro é Sustentável</title>
    <!-- Fonte moderna para um ar tecnológico -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050a07; /* Fundo quase preto com tom esverdeado */
            --primary: #22c55e; /* Verde neon */
            --primary-dark: #166534;
            --glass-bg: rgba(20, 30, 24, 0.7);
            --glass-border: rgba(34, 197, 94, 0.2);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --telegram-blue: #2AABEE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            /* Fundo com gradiente radial suave para profundidade */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(42, 171, 238, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Minimalista */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-light);
            letter-spacing: -0.5px;
        }

        .logo span { color: var(--primary); }

        /* Estrutura Principal (Hero) */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
            flex: 1;
            gap: 40px;
        }

        .hero-text {
            flex: 1;
            max-width: 600px;
        }

        /* Tag de destaque */
        .badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border);
        }

        .hero-text h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 800;
        }

        /* Texto com gradiente */
        .hero-text h1 span {
            background: linear-gradient(to right, var(--primary), #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Botão do Telegram Premium */
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, var(--telegram-blue), #1E96D4);
            color: white;
            padding: 16px 36px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -10px rgba(42, 171, 238, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-telegram:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px -10px rgba(42, 171, 238, 0.7);
        }

        .btn-telegram svg {
            margin-right: 12px;
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Seção do QR Code (Card de Vidro) */
        .qr-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            transition: transform 0.4s ease;
            position: relative;
        }

        /* Efeito de brilho atrás do QR Code */
        .qr-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.2;
            z-index: -1;
            border-radius: 50%;
        }

        .qr-card:hover {
            transform: translateY(-5px);
        }

        .qr-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        .qr-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .qr-card img {
            border-radius: 16px;
            background: white;
            padding: 10px;
            width: 100%;
            max-width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Responsividade para Mobile */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 40px 20px;
            }
            
            .hero-text h1 { font-size: 2.8rem; }
            
            .qr-wrapper { width: 100%; margin-top: 30px; }
            
            nav { padding: 20px; justify-content: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🌿 ECO<span>nomus</span></div>
    </nav>

    <main class="hero">
        <!-- Lado do Texto e Botão -->
        <div class="hero-text">
            <div class="badge">Educador Ambiental</div>
            <h1>O futuro é <span>sustentável</span>.</h1>
            <p>Seu assistente virtual focado em reciclagem, dicas de economia e preservação do meio ambiente. Descubra como pequenas atitudes transformam o planeta.</p>
            
            <!-- Botão que redireciona para o Telegram -->
            <a href="https://t.me/ECOnomusBot" target="_blank" class="btn-telegram">
                <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                Iniciar Conversa
            </a>
        </div>

        <!-- Lado do QR Code -->
        <div class="qr-wrapper">
            <div class="qr-card">
                <h3>Acesso Rápido</h3>
                <p>Abra a câmera do seu celular e escaneie para conversar.</p>
                <!-- IMPORTANTE: Lembre-se de alterar o link do text= abaixo se o seu bot não for o ECOnomusBot -->
                <img src="https://quickchart.io/qr?text=https://t.me/ECOnomusBot&size=250&margin=1" alt="QR Code Telegram ECOnomus">
            </div>
        </div>
    </main>

</body>
</html>
